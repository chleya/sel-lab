[project]
name = "sel-eggroll-engine"
version = "0.1.0"
description = "SEL + EGGROLL 双演化边缘智能框架"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.20.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.60.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test = [
    "pytest>=6.0.0",
    "pytest-cov>=2.12.0"
]
dev = [
    "black>=22.0.0",
    "flake8>=4.0.0",
    "isort>=5.0.0"
]
